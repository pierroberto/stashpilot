name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  changesets:
    # On main: open/update the "Version Packages" PR while changesets are pending; once that PR
    # is merged (no pending changesets, unpublished version), publish to npm and tag the release.
    name: Version or publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Create Version Packages PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          # `changeset publish` runs `npm publish --access public` (access is set in
          # .changeset/config.json) for versions not yet on npm, then creates the git tag.
          publish: npm run release
          title: Version Packages
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Read published version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  tag:
    # Manual fallback: pushing a tag like v1.2.3 publishes that version if it is not on npm yet
    # and makes sure a GitHub Release exists for it.
    name: Publish from tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Publish to npm
        run: |
          if npm view "stashpilot@${{ steps.version.outputs.version }}" version >/dev/null 2>&1; then
            echo "stashpilot@${{ steps.version.outputs.version }} is already published."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  binaries:
    name: Standalone binaries
    needs: [changesets, tag]
    if: >-
      always() &&
      (needs.changesets.outputs.published == 'true' || needs.tag.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Build executables
        # Cross-compiles all targets from one runner; Bun is used only here, never at runtime.
        run: bun scripts/build-binaries.ts

      - name: Smoke test Linux binary
        run: ./dist/spilot-linux-x64 --version

      - name: Upload to GitHub Release
        run: |
          version="${{ needs.changesets.outputs.version || needs.tag.outputs.version }}"
          gh release upload "v$version" \
            dist/spilot-darwin-arm64 \
            dist/spilot-darwin-x64 \
            dist/spilot-linux-x64 \
            dist/spilot-linux-arm64 \
            dist/spilot-windows-x64.exe \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
